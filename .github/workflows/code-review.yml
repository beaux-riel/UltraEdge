name: Manual Review Checklist

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review-checklist:
    runs-on: ubuntu-latest
    steps:
      # The previous third-party action no longer exists. This job records the
      # required human gate; a green checklist job does not certify code review.
      - name: Record required release review
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'CHECKLIST'
          ## Human review required
          This job publishes a checklist only. It does not perform or approve code review.

          - Review changed behavior and failure/recovery tests.
          - Check CI and the candidate commit used for native verification.
          - Exercise affected runner/crew journeys on the Release iOS build.
          - For release work, complete docs/release/V1-RELEASE-PACKAGE.md gates.
          - Obtain owner approval before publishing or changing production services.
          CHECKLIST
